spring:
  application:
    name: medmate-clinic-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/medmate_clinic_api}
    username: ${DATABASE_USER:medmate}
    password: ${DATABASE_PASSWORD:medmate}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    # Flyway owns every schema. Hibernate never creates or alters a table:
    # there is one schema per clinic, so a single validation pass cannot cover
    # them all — the mapping is checked by ClinicApiIT instead.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    # the registry is migrated by TenancyConfig, and each clinic schema is
    # migrated when the clinic is provisioned
    enabled: false

server:
  port: ${SERVER_PORT:8080}
  error:
    # The API answers every error in one envelope: {title, detail}. The
    # container's own error page must not add the exception message or the
    # stack trace on top of it — an unhandled failure used to leak the
    # internals of the service to whoever called it.
    include-message: never
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

medmate:
  # development | staging | production. Outside development the service refuses
  # to start with the test-mode sign-in turned on.
  # The environment the service runs in. It must be set: a deployment that
  # forgets it must not find itself running with the test-mode sign-in on.
  env: ${APP_ENV:}
  demo:
    # the development clinic gets people, patients and a queue; production does not
    enabled: ${DEMO_ENABLED:false}
    clinic-id: ${DEMO_CLINIC_ID:}
  tenancy:
    registry-schema: ${REGISTRY_SCHEMA:registry}
    clinic-schema-prefix: ${CLINIC_SCHEMA_PREFIX:clinic_}
  auth:
    # HS256 secret for the session tokens. Override in production.
    secret: ${AUTH_SECRET:dev-only-secret-change-me-please-32-bytes-min}
    issuer: medmate-clinic-api
    ttl-minutes: ${AUTH_TTL_MINUTES:720}
    otp-ttl-minutes: ${AUTH_OTP_TTL_MINUTES:5}
    # Test mode returns the code so a developer can sign in without a phone.
    expose-code: ${AUTH_EXPOSE_CODE:true}
  kiosk:
    # The clinic the kiosk is installed in. The kiosk belongs to one clinic,
    # and the caller cannot point it at another.
    clinic-slug: ${KIOSK_CLINIC_SLUG:medmate-clinic}
  cors:
    origins: ${CORS_ALLOWED_ORIGINS:${CORS_ORIGINS:http://localhost:3100,http://127.0.0.1:3100}}
