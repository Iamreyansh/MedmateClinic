spring:
  application:
    name: medmate-clinic-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/medmate}
    username: ${DATABASE_USER:medmate}
    password: ${DATABASE_PASSWORD:medmate}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    # Flyway owns the schema. Hibernate only checks that the mapping matches it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${DATABASE_SCHEMA:medmate}
    default-schema: ${DATABASE_SCHEMA:medmate}
    create-schemas: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

medmate:
  auth:
    # HS256 secret for the session tokens. Override in production.
    secret: ${AUTH_SECRET:dev-only-secret-change-me-please-32-bytes-min}
    issuer: medmate-clinic-api
    ttl-minutes: ${AUTH_TTL_MINUTES:720}
    otp-ttl-minutes: ${AUTH_OTP_TTL_MINUTES:5}
    # Test mode returns the code so a developer can sign in without a phone.
    expose-code: ${AUTH_EXPOSE_CODE:true}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:3100,http://127.0.0.1:3100}
