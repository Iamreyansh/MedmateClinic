# The whole stack: Postgres, the Java service, the web app.
#
#   docker compose up --build
#
# The web app is served by Vite in development mode here, so the API's calls
# are proxied and the SPA is hot-reloaded. For a production bundle, build it
# and serve `dist/` with any static server — the app's own guard refuses a
# production build with the mock on.
#
# The API's own fifteen variables are in `backend/.env.example`. The ones this
# file needs are listed below.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medmate_clinic_api}
      POSTGRES_USER: ${POSTGRES_USER:-medmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medmate}
    ports:
      - "${POSTGRES_PUBLISHED_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medmate} -d ${POSTGRES_DB:-medmate_clinic_api}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/medmate_clinic_api
      DATABASE_USER: medmate
      DATABASE_PASSWORD: medmate
      DATABASE_POOL_SIZE: 10
      APP_ENV: development
      AUTH_SECRET: ${AUTH_SECRET:-a-development-secret-change-me-in-production}
      AUTH_EXPOSE_CODE: "true"
      AUTH_TTL_MINUTES: 720
      AUTH_OTP_TTL_MINUTES: 5
      CORS_ALLOWED_ORIGINS: http://localhost:3100,http://127.0.0.1:3100
      SERVER_PORT: 8080
      REGISTRY_SCHEMA: registry
      CLINIC_SCHEMA_PREFIX: clinic_
      DEMO_ENABLED: "true"
      DEMO_CLINIC_ID: 11111111-1111-4111-8111-111111111111
      KIOSK_CLINIC_SLUG: medmate-clinic
    ports:
      - "${API_PUBLISHED_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_USE_MOCK: "false"
      VITE_API_TARGET: http://api:8080
    ports:
      - "${WEB_PUBLISHED_PORT:-3100}:3100"

volumes:
  postgres-data:
